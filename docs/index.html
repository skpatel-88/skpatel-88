<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Tic-Tac-Toe | Sandeep Kumar Patel</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    font-family: 'Fira Code', monospace;
    background: #0d1117;
    color: #e6edf3;
  }
  h1 { color: #2E9EF7; margin-bottom: 0; }
  #status { font-size: 1.1rem; min-height: 1.5rem; }
  #board {
    display: grid;
    grid-template-columns: repeat(3, 100px);
    grid-template-rows: repeat(3, 100px);
    gap: 6px;
  }
  .cell {
    background: #161b22;
    border: 2px solid #2E9EF7;
    border-radius: 8px;
    font-size: 2.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
    transition: background 0.15s;
  }
  .cell:hover { background: #21262d; }
  button {
    background: #2E9EF7;
    color: #0d1117;
    border: none;
    padding: 10px 20px;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
    font-family: inherit;
  }
  a { color: #2E9EF7; }
</style>
</head>
<body>
  <h1>🎮 Tic-Tac-Toe</h1>
  <div id="status">You are X — beat the computer (O)!</div>
  <div id="board"></div>
  <button id="restart">Restart</button>
  <a href="https://github.com/skpatel-88">&larr; Back to profile</a>

<script>
  const boardEl = document.getElementById('board');
  const statusEl = document.getElementById('status');
  const restartBtn = document.getElementById('restart');
  const WIN_LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  let board, gameOver;

  function init() {
    board = Array(9).fill(null);
    gameOver = false;
    statusEl.textContent = "You are X — beat the computer (O)!";
    render();
  }

  function render() {
    boardEl.innerHTML = '';
    board.forEach((val, i) => {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.textContent = val || '';
      cell.addEventListener('click', () => handleMove(i));
      boardEl.appendChild(cell);
    });
  }

  function winner(b) {
    for (const [a, b1, c] of WIN_LINES) {
      if (b[a] && b[a] === b[b1] && b[a] === b[c]) return b[a];
    }
    return b.every(Boolean) ? 'draw' : null;
  }

  function handleMove(i) {
    if (gameOver || board[i]) return;
    board[i] = 'X';
    render();
    const w = winner(board);
    if (w) return endGame(w);

    const move = computerMove();
    if (move !== -1) board[move] = 'O';
    render();
    const w2 = winner(board);
    if (w2) endGame(w2);
  }

  function computerMove() {
    const empty = board.map((v, i) => (v ? null : i)).filter(v => v !== null);
    if (empty.length === 0) return -1;
    // try to win, then block, else random
    for (const i of empty) {
      const copy = [...board]; copy[i] = 'O';
      if (winner(copy) === 'O') return i;
    }
    for (const i of empty) {
      const copy = [...board]; copy[i] = 'X';
      if (winner(copy) === 'X') return i;
    }
    return empty[Math.floor(Math.random() * empty.length)];
  }

  function endGame(w) {
    gameOver = true;
    statusEl.textContent = w === 'draw' ? "It's a draw!" : (w === 'X' ? 'You win! 🎉' : 'Computer wins! 🤖');
  }

  restartBtn.addEventListener('click', init);
  init();
</script>
</body>
</html>
